<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RoyalX — Telegram Mini App</title>
  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK (deferred to not block rendering) -->
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

  <!-- Preload top logo icon and Apple game stickers -->
  <link rel="preload" as="image" href="/logo-icon.png">
  <link rel="preload" as="image" href="/apple-gem.png">
  <link rel="preload" as="image" href="/apple-bomb.png">

  <script>
    window.addEventListener('error', function(e) {
      console.error('[GlobalError]', e.message, e.filename, e.lineno);
      var errEl = document.getElementById('emergency-error');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerHTML = '⚠️ <b>Ошибка загрузки интерфейса:</b> ' + (e.message || 'Неизвестная ошибка') + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small><br><button onclick="location.reload()" style="margin-top:10px;padding:6px 14px;background:#00e699;color:#05140d;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Перезагрузить</button>';
      }
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="emergency-error" style="display:none;position:fixed;top:20px;left:20px;right:20px;background:#1e1014;border:1px solid #ff4d4d;color:#ff9999;padding:16px;border-radius:12px;font-family:sans-serif;font-size:13px;z-index:9999999;box-shadow:0 10px 30px rgba(0,0,0,0.8);"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
